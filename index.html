<script id="data" type="application/json">{"common": {"a": [{"number": 1, "question": "A relational database management system (RDMS) is…", "options": ["a computer program that interacts with the database by issuing an appropriate request (SQL-request).", "a software system that enables users to define, create, maintain, and control access to the database.", "a shared collection of logically related data and its description, designed to meet the information needs of an organization.", "a collection of application programs that performs services for the end users, such as the production of reports. Each program defines an manages its own data."], "answer": 1, "explanation": "A DBMS is the software used to define, create, maintain and control access to a database.", "optionReasons": ["This describes a database application or client that sends requests. The DBMS is the software that manages the database and executes those requests.", "Correct. A DBMS provides facilities to define, create, maintain and control access to a database.", "This defines the database itself: the organized data and its description. The DBMS is the software managing it.", "This describes separate application programs managing their own files, rather than a shared database management system."]}, {"number": 2, "question": "Which normal form have something to do with transitive dependency to a candidate key...", "options": ["UNF", "1NF", "2NF", "3NF"], "answer": 3, "explanation": "3NF addresses transitive dependencies. For example, EmployeeID → DeptID → DeptName. Store department names in a separate Department table.", "optionReasons": ["UNF means unnormalized form. It does not impose the restrictions on transitive dependencies asked about here.", "1NF concerns atomic values and repeating groups. A table can satisfy 1NF and still have problematic transitive dependencies.", "2NF removes partial dependencies of non-prime attributes on candidate keys. Transitive dependencies can still remain.", "Correct. 3NF addresses problematic transitive dependencies, such as EmployeeID → DeptID → DeptName, by separating department facts."]}, {"number": 3, "question": "The concept to model top-down is about…", "options": ["to develop a system with priority on functions that create the most value from the smallest quantity of resources.", "to develop a system based on an organizations vision (economy, staff, functional-related).", "to model a system from initial knowledge about the requirements of the organization, which later is complemented with further details.", "to model a system from system developer´s perspective without involving the users."], "answer": 2, "explanation": "Top-down modelling starts with an overall understanding of business requirements, then adds detail.", "optionReasons": ["This is a way to prioritize development by value and cost. It does not describe the direction in which a data model is developed.", "Business goals can inform the model, but this option does not describe the defining top-down step: moving from a broad model to more detail.", "Correct. Top-down modelling starts with an overall understanding of requirements, then refines the model with more detail.", "Top-down does not mean excluding users. User and business requirements are needed to establish what the model must represent."]}, {"number": 4, "question": "There can be many unique keys and constraints in a relation, but which of the alternatives is not unique…", "options": ["candidate key", "unique index", "foreign key", "primary key"], "answer": 2, "explanation": "A foreign key does not have to be unique. Several orders can have the same CustomerID.", "optionReasons": ["A candidate key must uniquely identify a tuple and be minimal. It therefore cannot be the generally non-unique key asked for.", "A unique index enforces uniqueness of its indexed key values, subject to the DBMS rules for NULL. It is not the generally repeatable key intended here.", "Correct. A foreign key may repeat: many orders can reference the same customer. Its job is to validate the reference, not identify each child row uniquely.", "A primary key is a chosen candidate key. It must uniquely identify each row and cannot contain NULL."]}, {"number": 5, "question": "Cascade update is a constraint, which purpose is to…", "options": ["make it possible to update a primary key on a 1-side of a relationship.", "make it possible to update any candidate key on a 1-side of a relationship.", "manage updates of a candidate key on a 1-side of a relationship.", "strengthen the referential integrity as a part of the relational model."], "answer": 3, "explanation": "D is the selected best answer: the purpose is to preserve referential integrity. ON UPDATE CASCADE propagates a referenced key change to the corresponding foreign keys. The options overlap, so this choice is an interpretation.", "optionReasons": ["Partly true: cascading updates can allow a referenced primary key to change while updating child rows. This describes a use case rather than the broader purpose selected here.", "Too broad. The action applies to the key referenced by this foreign-key constraint, not automatically to every candidate key in the parent table.", "Partly true: a referenced candidate key can be involved. However, “manage updates” does not state the essential cascading action: propagating the change to referencing rows.", "Selected best answer for the intended integrity purpose. CASCADE preserves valid references by updating child keys. It does not provide stronger integrity than NO ACTION, which instead rejects a violating update. The original options overlap."], "ambiguous": true}, {"number": 6, "question": "The degree, is the…", "options": ["number of the attributes in a relation.", "number of the tuples in a relation.", "result of the cartesian product in a relation.", "projection of a column in a relation."], "answer": 0, "explanation": "Degree is the number of columns or attributes. Cardinality is the number of rows or tuples.", "optionReasons": ["Correct. The degree of a relation is its number of attributes or columns.", "The number of tuples or rows is the cardinality of the relation, not its degree.", "A Cartesian product combines every row from one relation with every row from another. It is an operation, not the definition of degree.", "Projection selects attributes from a relation. It can change the resulting degree, but it is not the degree itself."]}, {"number": 7, "question": "Data definition language (DDL) is a part of SQL, and its purpose is mainly to…", "options": ["let the users decide which data that is needed rather than how it´s achieved.", "let the users decide which data that is needed and exactly how it´s achieved.", "describe entities, attributes and associations together with entity- and referential- integrity rules.", "provide several operations that manage data in a database."], "answer": 2, "explanation": "DDL defines database structure: tables, columns, types and integrity constraints. DML reads and changes data.", "optionReasons": ["This describes the declarative style of SQL queries: specify the result you want. It does not identify the main role of DDL.", "Specifying exactly how to obtain data describes a procedural approach. DDL is concerned with defining database objects and rules.", "Correct. DDL defines structures and constraints, for example tables, columns, primary keys and foreign keys.", "Operations that retrieve or change stored data belong to data manipulation, commonly grouped under DML, rather than DDL."]}, {"number": 8, "question": "A null-value represents a value for an attribute, that is currently…", "options": ["either empty or 0 for this tuple.", "not allowed to be null for this tuple.", "unknown or not applicable for this tuple.", "deleted on the one-side of a relationship."], "answer": 2, "explanation": "NULL represents an unknown, missing or inapplicable value. It is not the same as zero or an empty string.", "optionReasons": ["Zero and an empty string are actual values. NULL is a marker for missing, unknown or inapplicable information.", "“Not allowed to be null” describes a NOT NULL constraint, which forbids NULL. It does not explain what NULL means.", "Correct. NULL can represent a value that is unknown or does not apply. It should not be treated as an ordinary zero or empty string.", "Deleting a parent row does not define NULL. A particular ON DELETE SET NULL rule may create NULL references, but other deletion rules behave differently."]}, {"number": 9, "question": "The primary key constraint is…", "options": ["a key that allows null-values.", "any unique attribute in a relation.", "the selected foreign key that is identifies tuples uniquely within a relation.", "the selected candidate key that is identifies tuples uniquely within a relation."], "answer": 3, "explanation": "The primary key is the selected candidate key. It uniquely identifies each row and cannot contain NULL.", "optionReasons": ["A primary-key column cannot contain NULL. Every row must have a usable identifier.", "A unique attribute might be a candidate key if it satisfies the necessary constraints, but uniqueness alone does not make it the selected primary key.", "A foreign key references another row. It is not necessarily unique and is not the definition of a primary key, although one column can serve both roles.", "Correct. The primary key is the candidate key selected as the main unique identifier for rows in the relation."]}, {"number": 10, "question": "The foreign key constraint in a relational database refers to…", "options": ["a key that uniquely identifies a record in a relation.", "a key used for ordering records in a relation.", "a key that establishes a link between two relations.", "a key that allows null values."], "answer": 2, "explanation": "A foreign key links a row to a referenced row, for example Orders.CustomerID → Customers.CustomerID.", "optionReasons": ["Uniquely identifying each row is the role of a candidate key or primary key. Foreign-key values can repeat.", "A foreign key is not a sorting rule. ORDER BY determines result order; indexes can help implement some access paths.", "Correct. The constraint creates and validates a reference between relations, for example Orders.CustomerID referencing Customers.CustomerID.", "A foreign key may allow NULL if its columns are nullable, but that is optional. Allowing NULL is not what defines a foreign key."]}, {"number": 11, "question": "The purpose with the normalization process in a relational database is to…", "options": ["eliminate redundancy and dependency in relations.", "add redundancy for faster query performance.", "create additional tables for better organization of data.", "remove unnecessary relationships between relations."], "answer": 0, "explanation": "Normalization reduces unnecessary repetition and insertion, update and deletion anomalies. A is simplified: valid functional dependencies should remain.", "optionReasons": ["Best option. Normalization reduces avoidable redundancy and problematic dependencies. The wording is simplified: valid functional dependencies are preserved, not all eliminated.", "Deliberately introducing redundancy to improve some reads is denormalization, the opposite design trade-off.", "Splitting a table can create additional tables, but table count is a means rather than the goal. The goal is to reduce redundancy and anomalies.", "Normalization should preserve necessary relationships and information. Its goal is not simply to remove relationships."]}, {"number": 12, "question": "The role of ACID properties in database transaction is to…", "options": ["ensure security of the database.", "control access to the database.", "maintain data integrity during transactions.", "optimize the query performance."], "answer": 2, "explanation": "ACID helps maintain data integrity through atomicity, consistency, isolation and durability.", "optionReasons": ["Security concerns threats and protection against unauthorized use. ACID concerns the correctness and reliability of transactions.", "Authentication and authorization control access. They are separate from the ACID transaction properties.", "Correct. Atomicity, consistency, isolation and durability help maintain reliable, valid data while transactions execute.", "ACID does not guarantee fast queries. Locking, logging and isolation can add work in exchange for transaction guarantees."]}, {"number": 13, "question": "A view in a database is a…", "options": ["virtual relation based on the result of a SELECT query.", "physical relation with stored data.", "relation used for temporary storage.", "relation containing only primary keys."], "answer": 0, "explanation": "An ordinary view is a virtual table defined by a SELECT query. It normally stores the query definition rather than a separate copy of the result.", "optionReasons": ["Correct. An ordinary view is a named query presented as a virtual relation, usually defined with CREATE VIEW ... AS SELECT.", "A base table stores rows. An ordinary view stores a query definition; materialized views are a separate special case.", "A temporary table stores temporary rows. A view does not have to be temporary and is not defined by temporary storage.", "A view can expose many kinds of columns and expressions. It is not restricted to primary keys."]}, {"number": 14, "question": "A stored procedure in the context of a relational database is a…", "options": ["table that temporary stores data.", "predefined set of SQL statements stored for reuse.", "constraint that ensures data uniqueness.", "type of primary key."], "answer": 1, "explanation": "A stored procedure is a predefined set of SQL statements stored in the database for reuse.", "optionReasons": ["This describes a temporary table. A stored procedure stores executable SQL logic rather than being a table of temporary data.", "Correct. A stored procedure contains predefined SQL statements that can be invoked and reused, often with parameters.", "UNIQUE or PRIMARY KEY constraints enforce uniqueness. A stored procedure is not itself a uniqueness constraint.", "A primary key identifies rows. A stored procedure is executable database logic, not a key."]}, {"number": 15, "question": "The purpose of data warehouses in a business environment is to…", "options": ["store only recent and frequently accessed data.", "facilitate real-time transaction processing.", "consolidate and analyze historical data for decision-making.", "enforce data normalization."], "answer": 2, "explanation": "A data warehouse combines data from multiple sources and retains historical data for analysis and decision-making.", "optionReasons": ["A warehouse typically retains historical data for analysis, rather than restricting itself to recent, frequently accessed records.", "Real-time operational transactions are mainly the concern of transactional systems. Warehouses are primarily designed for analysis.", "Correct. Combining historical data supports reporting, trend analysis and business decisions.", "Enforcing normalization is not the purpose of a warehouse. Analytical designs may deliberately use denormalized structures."]}, {"number": 16, "question": "In the context of data warehouses, ETL is…", "options": ["Extract, Transform and Load – a process for transferring data between databases.", "Edit, Transfer and Load – a process for updating database records.", "Encrypt, Transmit and Log – a process for securing data transmission.", "Extract, Transfer and Log – a process for creating data backups."], "answer": 0, "explanation": "ETL means Extract, Transform, Load: retrieve source data, process it and load it into the destination system.", "optionReasons": ["Correct. Extract obtains data, Transform cleans or reshapes it, and Load writes it into the destination system.", "ETL does not stand for Edit, Transfer, Load. Transformation covers cleaning and restructuring, not just editing records.", "Encryption and logging may be used in a pipeline, but they are not what the letters ETL stand for.", "The T means Transform and the L means Load. Backup logging is not the definition of ETL."]}, {"number": 17, "question": "Data mining in the context of databases is the…", "options": ["process of extracting valuable information from unstructured data.", "process of extracting patterns and knowledge from large datasets.", "process of normalization of database relations", "process of encrypting sensitive data."], "answer": 1, "explanation": "Data mining identifies useful patterns and knowledge in large datasets.", "optionReasons": ["Too narrow. Data mining can work on structured as well as unstructured data, and its defining aim is finding patterns and knowledge.", "Correct. Data mining discovers useful patterns and knowledge in datasets, for example associations or predictive patterns.", "Normalization organizes relational schemas to reduce redundancy and anomalies. It is not pattern discovery.", "Encryption protects data by transforming it using cryptographic methods. It is not data mining."]}, {"number": 18, "question": "A common goal of data mining is to…", "options": ["increasing data redundancy.", "predicting future trends and behaviors.", "eliminating primary keys in relations.", "creating data warehouses."], "answer": 1, "explanation": "Predictive methods can forecast customer churn, demand or sales.", "optionReasons": ["Increasing duplicated data is not a goal of data mining. It adds redundancy without itself discovering knowledge.", "Correct. Predictive mining can estimate future trends or behavior, such as customer churn or demand.", "Removing primary keys is a schema change that can harm identification and integrity. It is not an analytical objective.", "Building a warehouse prepares an analytical data store. Mining may use that store, but creating it is not itself the mining goal."]}, {"number": 19, "question": "The primary goal with Entity-Relationship modeling in the context of database design is to…", "options": ["define data types for attributes.", "represent relationships between relations.", "enforce referential integrity.", "optimize query performance."], "answer": 1, "explanation": "B is the best available option. ER modelling represents entities and their relationships. The original wording “relations” is less precise than “entities”.", "optionReasons": ["Data types are specified during more detailed logical or physical design. They are not the main purpose of an ER model.", "Best available option. ER modelling represents entities and their relationships. The original word “relations” is less precise than “entities”.", "An ER model describes relationships and constraints. Enforcing referential integrity in the implemented database is the job of constraints such as foreign keys.", "Query optimization concerns execution efficiency. ER modelling primarily captures the information and relationships the system must represent."]}, {"number": 20, "question": "The primary focus of conceptual database design is to…", "options": ["defining primary keys for tables.", "creating an initial relational structure.", "identifying entities, their attributes and their relationships.", "normalizing relations for optimization."], "answer": 2, "explanation": "Conceptual design identifies the entities, attributes and relationships that the database must represent.", "optionReasons": ["Choosing table primary keys belongs mainly to logical design. Conceptual modelling can identify business identifiers, but table constraints are not its main focus.", "An initial relational schema is a logical-design result. Conceptual design first captures the business entities and relationships.", "Correct. Conceptual design identifies entities, their attributes and their relationships without committing to detailed implementation choices.", "Normalization evaluates and improves relational schemas. It is not the primary task of the initial conceptual model."]}], "b": [{"number": 21, "title": "Normalization", "points": 8, "question": "Normalization rules is useful to validate a database design. Define and give an explained example of:", "tables": [], "parts": [{"label": "a", "text": "Functional dependency.", "sql": false, "solution": {"paragraphs": ["X → Y means that equal X values always imply equal Y values in valid data. For example, CustomerID → CustomerName if each customer ID identifies one customer. This is a rule about valid data, not a coincidence in a few sample rows."]}}, {"label": "b", "text": "First normal form (1NF).", "sql": false, "solution": {"paragraphs": ["1NF requires atomic values and no repeating groups. Replace Customer(1, “111, 222”) with CustomerPhone(1, “111”) and CustomerPhone(1, “222”). Each row now represents one phone number."]}}, {"label": "c", "text": "Second normal form (2NF).", "sql": false, "solution": {"paragraphs": ["2NF requires 1NF and no partial dependencies of non-prime attributes on any candidate key. In OrderLine(OrderID, ProductID, ProductName, Qty), with key (OrderID, ProductID), ProductName depends only on ProductID. Move it to Product(ProductID, ProductName)."]}}, {"label": "d", "text": "Third normal form (3NF).", "sql": false, "solution": {"paragraphs": ["3NF removes problematic transitive dependencies. For EmployeeID → DeptID → DeptName, use Employee(EmployeeID, DeptID) and Department(DeptID, DeptName). Formally, every non-trivial dependency X → A must have X as a superkey or A as an attribute belonging to a candidate key."]}}]}, {"number": 22, "title": "Database design", "points": 6, "question": "It is important to discuss how a normalized relational database (to 3NF) contributes to:", "tables": [], "parts": [{"label": "a", "text": "data integrity.", "sql": false, "solution": {"paragraphs": ["Less repetition reduces conflicting data. Store a customer address once instead of copying it into every order, reducing update anomalies. Primary keys, foreign keys and other constraints are still needed to enforce the rules."]}}, {"label": "b", "text": "efficiency.", "sql": false, "solution": {"paragraphs": ["Less repetition can reduce storage and the number of places that must be updated. However, normalization does not guarantee faster SELECT queries: decomposed tables may require more joins. Distinguish storage and update efficiency from read performance."]}}, {"label": "c", "text": "maintainability.", "sql": false, "solution": {"paragraphs": ["Each table has a clearer responsibility. A fact such as a product name is updated in one place and reused through relationships, simplifying changes and troubleshooting."]}}]}, {"number": 23, "title": "JOIN queries", "points": 8, "question": "Explain how each one of the join questions listed below (inner, left, right, full outer) works and give an example on what the outcome will be from the data in Employee and Project tables.", "tables": [{"caption": "Employee Table", "headers": ["EmployeeID", "EmployeeName", "Department"], "rows": [["101", "Alice", "Marketing"], ["102", "Bob", "IT"], ["103", "Charlie", "Finance"]]}, {"caption": "Project Table", "headers": ["ProjectID", "ProjectName", "EmployeeID"], "rows": [["501", "Marketing Campaign", "101"], ["502", "Database Upgrade", "102"], ["503", "Financial Analysis", "103"], ["504", "Website Redesign", "105"]]}], "parts": [{"label": "a", "text": "SELECT employee.EmployeeID, employee.EmployeeName, project.ProjectName\nFROM employee\nINNER JOIN project ON employee.EmployeeID = project.EmployeeID;", "sql": true, "solution": {"paragraphs": ["INNER JOIN keeps only matching EmployeeID values. The three employees each match a project; project 504 has no matching employee and is excluded. Without ORDER BY, the order of the result rows is not guaranteed."], "table": {"caption": "Example result", "headers": ["EmployeeID", "EmployeeName", "ProjectName"], "rows": [["101", "Alice", "Marketing Campaign"], ["102", "Bob", "Database Upgrade"], ["103", "Charlie", "Financial Analysis"]]}}}, {"label": "b", "text": "SELECT employee.EmployeeID, employee.EmployeeName, project.ProjectName\nFROM employee\nLEFT JOIN project ON employee.EmployeeID = project.EmployeeID;", "sql": true, "solution": {"paragraphs": ["LEFT JOIN keeps every employee and adds matching project data. All three employees have a project here, so the rows are the same as for INNER JOIN. An employee without a project would have NULL in the project columns. Row order is not guaranteed without ORDER BY."], "table": {"caption": "Example result", "headers": ["EmployeeID", "EmployeeName", "ProjectName"], "rows": [["101", "Alice", "Marketing Campaign"], ["102", "Bob", "Database Upgrade"], ["103", "Charlie", "Financial Analysis"]]}}}, {"label": "c", "text": "SELECT employee.EmployeeID, employee.EmployeeName, project.ProjectName\nFROM employee\nRIGHT JOIN project ON employee.EmployeeID = project.EmployeeID;", "sql": true, "solution": {"paragraphs": ["RIGHT JOIN keeps every project. Website Redesign has EmployeeID 105 in Project but no matching Employee row. The SELECT uses employee.EmployeeID, so that result value is NULL, not 105. Row order is not guaranteed."], "table": {"caption": "Example result", "headers": ["EmployeeID", "EmployeeName", "ProjectName"], "rows": [["101", "Alice", "Marketing Campaign"], ["102", "Bob", "Database Upgrade"], ["103", "Charlie", "Financial Analysis"], ["NULL", "NULL", "Website Redesign"]]}}}, {"label": "d", "text": "SELECT employee.EmployeeID, employee.EmployeeName, project.ProjectName\nFROM employee\nFULL OUTER JOIN project ON employee.EmployeeID = project.EmployeeID;", "sql": true, "solution": {"paragraphs": ["FULL OUTER JOIN keeps unmatched rows from both sides. Here there are no unmatched employees and one unmatched project, so the result has the same four rows as RIGHT JOIN. EmployeeID and EmployeeName are NULL for Website Redesign. Row order is not guaranteed."], "table": {"caption": "Example result", "headers": ["EmployeeID", "EmployeeName", "ProjectName"], "rows": [["101", "Alice", "Marketing Campaign"], ["102", "Bob", "Database Upgrade"], ["103", "Charlie", "Financial Analysis"], ["NULL", "NULL", "Website Redesign"]]}}}]}, {"number": 24, "title": "SQL queries", "points": 12, "question": "Use the data from following three database tables to answer what the SQL-questions below returns. Make sure that you list your answer exactly as it is returned from the MS SQL database, including the attribute names for each column. The tables are related by using referential integrity between the primary and foreign keys (in one case empno and in another case pid). Also note the chosen primary keys for each table below.", "tables": [{"caption": "Table 1: employee (primary key is: empno)", "headers": ["empno", "surename", "forename", "dob", "address", "telno", "depno"], "rows": [["101", "Nielsen", "Sophie", "1993-11-23", "Main str 22", "+4412312345", "1"], ["102", "Johnson", "Mike", "1973-06-10", "Kings cross 123", "+4465633339", "1"], ["103", "Cash", "Sarah", "1975-08-05", "Rooster rd 23", "+4445456454", "1"]]}, {"caption": "Table 2: employee_position (primary key is: empno, pid and employed)", "headers": ["empno", "pid", "employed", "employed percentage"], "rows": [["101", "1", "1999-01-01", "100"], ["102", "2", "1999-12-01", "100"], ["103", "3", "1999-01-01", "25"], ["103", "4", "1999-01-01", "75"], ["103", "4", "2005-12-01", "100"]]}, {"caption": "Table 3: position (primary key is: pid)", "headers": ["pid", "position", "description"], "rows": [["1", "Secretary", "Assistance for m…"], ["2", "Manager", "Decide what to do."], ["3", "Programmer", "Programming th…"], ["4", "Designer", "Designing the GUI."]]}], "parts": [{"label": "a", "text": "SELECT [position] AS [Title], description AS [Explanation] \nFROM position\nORDER BY [position] ASC;", "sql": true, "solution": {"paragraphs": ["AS renames the output columns to Title and Explanation. ORDER BY position ASC produces the alphabetical order below. Two descriptions are truncated in the original table; their full values cannot be recovered. The ellipses below are not known characters in the database values."], "table": {"caption": "Visible values — two descriptions are truncated", "headers": ["Title", "Explanation"], "rows": [["Designer", "Designing the GUI."], ["Manager", "Decide what to do."], ["Programmer", "Programming th… [truncated in the question]"], ["Secretary", "Assistance for m… [truncated in the question]"]]}}}, {"label": "b", "text": "SELECT empno, position, [employed percentage] AS [%], employed \nFROM employee_position INNER JOIN position\nON employee_position.pid = position.pid ORDER BY\nempno,employed ASC;", "sql": true, "solution": {"paragraphs": ["The JOIN matches employee_position.pid to position.pid. The employed percentage column is renamed %. Rows are sorted by empno and then employed. The two rows for employee 103 dated 1999-01-01 tie on both sort keys, so their relative order is unspecified. Dates below use the format shown in the question."], "table": {"caption": "Example result", "headers": ["empno", "position", "%", "employed"], "rows": [["101", "Secretary", "100", "1999-01-01"], ["102", "Manager", "100", "1999-12-01"], ["103", "Programmer", "25", "1999-01-01"], ["103", "Designer", "75", "1999-01-01"], ["103", "Designer", "100", "2005-12-01"]]}}}, {"label": "c", "text": "SELECT empno, SUM([employed percentage]) AS [Summary in %] FROM \nemployee_position\nGROUP BY empno ORDER BY empno ASC;", "sql": true, "solution": {"paragraphs": ["GROUP BY creates one group per empno and SUM includes every row in each group. For 103, the result is 25 + 75 + 100 = 200. No WHERE clause restricts the calculation to a current position or a particular date."], "table": {"caption": "Example result", "headers": ["empno", "Summary in %"], "rows": [["101", "100"], ["102", "100"], ["103", "200"]]}}}, {"label": "d", "text": "INSERT INTO employee_position (empno,pid,employed,[employed percentage]) VALUES (103,4,'1999-01-01',25);", "sql": true, "solution": {"paragraphs": ["The INSERT fails because the primary key (empno, pid, employed) already contains (103, 4, 1999-01-01). Changing employed percentage from 75 to 25 does not resolve the duplicate key. No row is inserted."]}}, {"label": "e", "text": "DELETE FROM employee_position\nWHERE empno=101 AND pid=1;", "sql": true, "solution": {"paragraphs": ["The DELETE removes the one employee_position row with empno = 101 and pid = 1. It does not remove the employee or the position itself. This DELETE does not return a SELECT result table."]}}, {"label": "f", "text": "UPDATE employee SET empno=105\nWHERE empno=103", "sql": true, "solution": {"paragraphs": ["The UPDATE tries to change employee.empno from 103 to 105 while three employee_position rows reference 103. With SQL Server’s default ON UPDATE NO ACTION, it fails. With ON UPDATE CASCADE, the parent ID and all three foreign-key values change to 105. The question does not specify the update rule, so state your assumption."]}}]}, {"number": 25, "title": "GDPR", "points": 6, "question": "The General Data Protection Regulation (GDPR) has a notable impact on database design, influencing how organizations structure and manage their databases to ensure compliance with the regulation.", "tables": [], "parts": [{"label": "a", "text": "What is the purpose with GDPR? (2p)", "sql": false, "solution": {"paragraphs": ["GDPR protects people’s rights and freedoms when personal data is processed and establishes rules for that processing. Data protection should be built into systems and working practices."]}}, {"label": "b", "text": "Discuss the four most important aspects of how GDPR impacts our design of databases? (4p)", "sql": false, "solution": {"paragraphs": ["Four relevant design considerations:", "1. Purpose and data minimization: store only the personal data needed for the specified purpose.", "2. Retention: plan deletion or anonymization when data is no longer needed, taking applicable retention requirements into account.", "3. Security and access: apply appropriate safeguards and give users only the permissions they need.", "4. Individual rights: make personal data retrievable and manageable for requests such as access or erasure where the right applies."]}}]}]}, "new2026": {"a": [{"number": 1, "question": "What is reqired for a table to be in 1NF?", "options": ["No partial dependencies.", "No transitive dependencies.", "Atomic attribute values.", "Only numeric attributes."], "answer": 2, "explanation": "1NF requires atomic attribute values: each cell holds a single value rather than a list. Partial and transitive dependencies are addressed by later normal forms.", "optionReasons": ["Removing partial dependencies of non-prime attributes is a 2NF requirement. A 1NF table can still have them.", "Problematic transitive dependencies are addressed by 3NF. Their absence is not a requirement for 1NF alone.", "Correct. In 1NF, attribute values are atomic: a cell does not hold a list or repeating group of separate values.", "1NF does not require numeric data. Text, dates and other atomic values are allowed."]}, {"number": 2, "question": "What is a superkey?", "options": ["A minimal key.", "A key with extra attributes.", "Only the primary key.", "Only candidate keys."], "answer": 1, "explanation": "B is the best available option, but it is simplified. A superkey uniquely identifies a row and may contain redundant attributes. Extra attributes are not required: a candidate key is also a superkey.", "optionReasons": ["A minimal superkey is a candidate key. It is also a superkey, but minimality is not required for all superkeys, so this is too restrictive as a definition.", "Best available option, but incomplete. A superkey may include extra attributes while still uniquely identifying rows. Extra attributes are allowed, not required.", "The primary key is one selected candidate key. Other candidate keys and supersets of keys are also superkeys.", "Candidate keys are only the minimal superkeys. Adding attributes to a candidate key still gives a superkey, so “only” is incorrect."], "ambiguous": true}, {"number": 3, "question": "What is the role of a foreign key in normalization?", "options": ["To create redundancy.", "To connect tables after decomposition.", "To replace primary keys.", "To eliminate functional dependencies."], "answer": 1, "explanation": "Foreign keys preserve relationships after decomposition, for example Employee.Department → Department.Department. Normalization does not eliminate all functional dependencies.", "optionReasons": ["Repeating a foreign-key value is not the same as unnecessarily repeating a fact. The purpose is to preserve references between the decomposed tables.", "Correct. Foreign keys reconnect decomposed tables, for example an employee’s department reference pointing to a Department row.", "A foreign key does not replace the need to identify rows. Decomposed tables still need appropriate primary or candidate keys.", "Foreign keys enforce references. They do not eliminate functional dependencies, and valid dependencies remain after normalization."]}, {"number": 4, "question": "An over-normalized database can lead to:", "options": ["More redundancy.", "Fewer tables.", "Complex JOIN questions.", "Poorer data integrity."], "answer": 2, "explanation": "Splitting data into many tables can require more complex JOIN queries. “Over-normalized” describes a practical trade-off, not a separate normal form.", "optionReasons": ["Normalization generally reduces avoidable redundancy. Increasing redundancy is not the usual problem implied by over-normalization.", "Decomposing relations generally creates more tables, not fewer.", "Correct. Retrieving information spread across many tables can require more complicated JOIN queries.", "Further decomposition does not inherently weaken integrity. The practical concern here is query complexity rather than automatically poorer integrity."]}, {"number": 5, "question": "When can denormalization be appropriate?", "options": ["During ER-modeling.", "To improve read performance.", "To achieve BCNF.", "To avoid indexes."], "answer": 1, "explanation": "Denormalization can improve reads by reducing expensive joins. The trade-off may be extra storage and more work to keep repeated data consistent.", "optionReasons": ["ER modelling captures requirements and relationships. Being at that stage alone is not a reason to introduce redundancy.", "Correct. Denormalization can improve particular read workloads by reducing joins, at the cost of duplicated data and more maintenance.", "BCNF is a stricter normalization target. Denormalization does not aim to achieve it.", "Denormalization does not remove the need for indexes. Indexing and schema design address different performance choices."]}, {"number": 6, "question": "Which is a sign of poor normalization?", "options": ["Many tables.", "Many JOINS.", "Repeated data across multiple rows.", "Foreign keys."], "answer": 2, "explanation": "Repeating the same fact, such as a department address, across many employee rows creates a risk of inconsistent updates. Repeated foreign-key values alone are normal and do not prove poor normalization.", "optionReasons": ["Many tables can be the result of a well-normalized design. Table count alone does not show poor normalization.", "Joins are a normal way to reconstruct related information after decomposition. Their presence alone does not indicate a normalization error.", "Best option. Repeated facts, such as the same department address on many employee rows, can create update anomalies. Repeated foreign-key values alone are not a defect.", "Foreign keys preserve relationships between tables. They are an expected part of a normalized design, not evidence of poor normalization."]}, {"number": 7, "question": "Which of the following is NOT a goal of normalization?", "options": ["Eliminate redundancy.", "Improve data quality.", "Maximize performance.", "Avoid anomalies."], "answer": 2, "explanation": "Normalization reduces problematic redundancy and anomalies. It does not guarantee maximum query performance; some reads require more joins.", "optionReasons": ["Reducing avoidable redundancy is a goal of normalization. Because the question asks what is NOT a goal, this is not the answer.", "Reducing contradictory copies and anomalies can improve data quality. That fits the purpose of normalization.", "Correct for this NOT question. Normalization does not aim to maximize every query’s speed; additional joins may make some reads slower.", "Avoiding insertion, update and deletion anomalies is a central goal of normalization."]}, {"number": 8, "question": "A table in 2NF can still have:", "options": ["Partial dependencies.", "Transitive dependencies.", "Multivalued attributes.", "Repeating groups."], "answer": 1, "explanation": "2NF requires 1NF and no partial dependencies of non-prime attributes on a candidate key. Transitive dependencies can still remain.", "optionReasons": ["2NF excludes partial dependencies of non-prime attributes on candidate keys. Keeping those would violate 2NF.", "Correct. A 2NF table can still have a dependency such as EmployeeID → DeptID → DeptName that calls for further decomposition.", "Lists of separate values in an attribute violate 1NF. Because 2NF also requires 1NF, these are not allowed in this context.", "Repeating groups violate 1NF, which is a prerequisite for 2NF."]}, {"number": 9, "question": "Which concept is fundamental to normalization?", "options": ["Indexes.", "Functional dependencies.", "SQL views.", "Transactions."], "answer": 1, "explanation": "Functional dependencies describe which attributes determine other attributes. X → Y means equal X values always imply equal Y values in valid data.", "optionReasons": ["Indexes support access paths and performance. They are not the foundation for deciding a relation’s normal form.", "Correct. Functional dependencies express which attributes determine others and guide decomposition and normal-form checks.", "Views define query interfaces over data. They do not determine the underlying functional dependencies.", "Transactions group operations into units of work. Normalization concerns the structure of the schema."]}, {"number": 10, "question": "Which normal form is most commonly used in practical database systems?", "options": ["1NF.", "2NF.", "3NF.", "BCNF."], "answer": 2, "explanation": "3NF is a common practical design target and the expected answer here. BCNF is stronger but is not required for every database.", "optionReasons": ["1NF is a starting requirement. A design that stops at 1NF can still contain partial and transitive dependencies.", "2NF removes partial dependencies but may leave problematic transitive dependencies. It is an intermediate target in the usual design process.", "Expected answer. 3NF is a common practical target that addresses many redundancy and anomaly problems while preserving dependencies.", "BCNF is a valid, stronger target. It is not the expected answer to this broad introductory question about common practice; that wording is a generalization, not a universal rule."]}, {"number": 11, "question": "A tuple in a relation corresponds to:", "options": ["A column.", "A table.", "A row.", "An index."], "answer": 2, "explanation": "A tuple is a row. Attributes correspond to columns, and the relation corresponds to the table.", "optionReasons": ["A column represents an attribute. A tuple contains one set of attribute values across a row.", "A relation corresponds to the table as a whole. A tuple is one row within it.", "Correct. A tuple is a row containing values for the relation’s attributes.", "An index is an access structure used to locate data efficiently. It is not a tuple."]}, {"number": 12, "question": "Which of the following best defines a domain?", "options": ["A set of valid values for an attribute.", "A collection of tuples.", "A primary key.", "A table name."], "answer": 0, "explanation": "A domain is the set of permitted values for an attribute, such as valid dates or department codes. It is not the set of rows currently stored.", "optionReasons": ["Correct. A domain is the set of permitted values for an attribute, such as valid dates or department codes.", "A set of tuples forms a relation instance. A domain concerns the allowed values of an attribute.", "A primary key identifies a row uniquely. Its attributes have domains, but the key itself is not a domain.", "A table name identifies a relation. It does not specify which values an attribute may contain."]}, {"number": 13, "question": "Which statement about relations is true?", "options": ["Relations allow duplicate tuples.", "The order of tuples is significant.", "Attribute names must be unique within a relation.", "Relations may contain multivalued attributes."], "answer": 2, "explanation": "Attribute names must be unique within a relation. In the classical relational model, duplicate tuples are excluded and row order has no meaning. SQL query results can contain duplicates unless DISTINCT is used.", "optionReasons": ["In the classical relational model, a relation is a set and has no duplicate tuples. SQL tables or query results can allow duplicates, which is a separate distinction.", "Tuples have no inherent order in a relation. In SQL, use ORDER BY when a particular result order is required.", "Correct. Each attribute needs a distinct name within the relation so it can be identified unambiguously.", "In the classical 1NF model used here, an attribute holds an atomic value, not a list of separate values."]}, {"number": 14, "question": "What is the primary purpose of a primary key?", "options": ["Improve query performance.", "Uniquely identify tuples in a relation.", "Reference to another relation.", "Allow NULL values."], "answer": 1, "explanation": "A primary key uniquely identifies each row and cannot contain NULL. It can contain one column or several columns.", "optionReasons": ["A primary key is often supported by an index, which can help some queries. Its defining purpose is identification, not performance.", "Correct. The primary key uniquely identifies each tuple and must be non-NULL.", "Referencing another relation is the role of a foreign key. A column can serve both roles, but the roles are distinct.", "A primary key forbids NULL. It needs a present value to identify every row."]}, {"number": 15, "question": "A candidate key is:", "options": ["Any foreign key.", "A minimal superkey.", "A key with redundant attributes.", "Always chosen as the primary key."], "answer": 1, "explanation": "A candidate key is a minimal superkey: removing any of its attributes would remove the guarantee of uniqueness. One candidate key is selected as the primary key.", "optionReasons": ["A foreign key may repeat and therefore need not identify rows uniquely. It is not automatically a candidate key.", "Correct. A candidate key is a superkey with no removable attributes: it is both unique and minimal.", "Redundant attributes make a superkey non-minimal. Removing them gives a candidate key.", "A relation can have several candidate keys, but only one is selected as the primary key. The others remain alternate keys."]}, {"number": 16, "question": "A foreign key is used to:", "options": ["Identify tuples uniquely.", "Enforce referential integrity.", "Improve indexing.", "Normalize relations."], "answer": 1, "explanation": "A foreign-key constraint enforces referential integrity. Several child rows may reference the same parent row.", "optionReasons": ["A foreign key may repeat across many rows. Primary or candidate keys provide unique row identification.", "Correct. A foreign-key constraint prevents non-NULL references from pointing to nonexistent referenced keys.", "An index on a foreign key can help performance, but indexing is not the purpose of the foreign-key constraint itself.", "Foreign keys connect decomposed tables, but declaring one does not by itself normalize a relation or remove its problematic dependencies."]}, {"number": 17, "question": "Which constraint ensures that an attribute cannot contain NULL values?", "options": ["UNIQUE.", "CHECK.", "NOT NULL.", "DEFAULT."], "answer": 2, "explanation": "NOT NULL explicitly forbids NULL. UNIQUE concerns uniqueness; DEFAULT supplies a value when one is omitted.", "optionReasons": ["UNIQUE prevents duplicate key values according to the DBMS’s NULL rules. It is not a general prohibition on NULL.", "A specifically written CHECK (column IS NOT NULL) can forbid NULL. However, CHECK by itself names a general condition mechanism; NOT NULL is the direct, intended constraint here.", "Correct. NOT NULL explicitly requires a non-NULL value in the column.", "DEFAULT supplies a value when one is omitted. It does not generally prevent an explicit NULL from being inserted."], "ambiguous": true}, {"number": 18, "question": "Referential integrity ensures that:", "options": ["All attributes are atomic.", "All primary keys are indexed.", "A foreign key value must reference an existing tuple.", "No duplicate rows exist."], "answer": 2, "explanation": "A non-NULL foreign-key value must match an existing referenced key. A nullable foreign key may contain NULL to represent an absent relationship.", "optionReasons": ["Atomic attribute values are a 1NF concern, not the definition of referential integrity.", "Indexes concern access structures and may support key enforcement. Referential integrity is about valid references, not whether every primary key has an index.", "Correct for a non-NULL foreign key. Its value must match an existing referenced key; a nullable foreign key may instead contain NULL.", "Preventing duplicate rows is a uniqueness concern. Referential integrity checks links between rows."]}, {"number": 19, "question": "Which SQL clause is used to filter rows?", "options": ["SELECT.", "FROM.", "WHERE.", "GROUP BY."], "answer": 2, "explanation": "WHERE filters individual rows. SELECT chooses columns or expressions, FROM identifies data sources, and GROUP BY forms groups.", "labels": ["E", "F", "G", "H"], "optionReasons": ["SELECT chooses which columns or expressions appear in the result. It does not specify the row-filter condition.", "FROM identifies the tables or other data sources. It does not itself provide the WHERE row filter.", "Correct. WHERE keeps only rows for which its condition is true, for example WHERE Salary > 50000.", "GROUP BY combines rows into groups. It does not act as the filter for individual input rows."]}, {"number": 20, "question": "Which clause is used to group rows for aggregation?", "options": ["WHERE.", "GROUP BY.", "HAVING.", "ORDER BY."], "answer": 1, "explanation": "GROUP BY forms groups for aggregates such as SUM or COUNT. HAVING filters groups; ORDER BY sorts the result.", "labels": ["I", "J", "K", "L"], "optionReasons": ["WHERE filters individual rows before grouping. It does not form aggregation groups.", "Correct. GROUP BY creates groups with matching grouping values, allowing an aggregate result per group.", "HAVING filters groups, usually based on an aggregate condition. GROUP BY is what forms the groups.", "ORDER BY sorts the result. Sorting does not perform grouping or aggregation."]}, {"number": 21, "question": "The main goal of normalization is to:", "options": ["Improve query speed.", "Reduce redundancy and anomalies.", "Increase storage efficiency.", "Simplify SQL syntax."], "answer": 1, "explanation": "Normalization reduces unnecessary repetition of facts and insertion, update and deletion anomalies.", "optionReasons": ["Normalization does not guarantee faster queries. Some reads need more joins after decomposition.", "Correct. The central goal is to reduce avoidable redundancy and insertion, update and deletion anomalies.", "Saving storage can be a benefit of removing repeated facts, but it is narrower than the overall goal of avoiding redundancy and anomalies.", "Normalized data may require more joins and longer SQL statements. Simplifying SQL syntax is not the goal."]}, {"number": 22, "question": "A table in 3NF:", "options": ["Allows transitive dependencies.", "Eliminates partial and transitive dependencies.", "Requires BCNF.", "Eliminates all functional dependencies."], "answer": 1, "explanation": "B is the intended introductory answer: remove partial and problematic transitive dependencies involving non-prime attributes. Valid functional dependencies remain. Formally, 3NF also permits a non-trivial X → A when A belongs to a candidate key, even if X is not a superkey.", "optionReasons": ["Some transitive dependencies involving prime attributes can be permitted in formal 3NF. This option does not express its defining requirement; B is the intended introductory description.", "Best option in the introductory sense: remove partial and problematic transitive dependencies involving non-prime attributes. Formal 3NF also permits X → A when A belongs to a candidate key, even if X is not a superkey.", "BCNF is stronger than 3NF. A table can satisfy 3NF without satisfying BCNF.", "Valid functional dependencies remain, including dependencies from a key to other attributes. Eliminating all dependencies is neither possible nor the goal."], "ambiguous": true}, {"number": 23, "question": "Which ACID property ensures that a transaction is all-or-nothing?", "options": ["Atomicity.", "Consistency.", "Isolation.", "Durability."], "answer": 0, "explanation": "Atomicity means the whole transaction succeeds or its changes are rolled back. A money transfer must not debit one account without completing the corresponding credit.", "optionReasons": ["Correct. Atomicity means either all operations in the transaction take effect or its changes are rolled back.", "Consistency concerns preserving database rules and valid states. It is not the name of the all-or-nothing property.", "Isolation concerns interference between concurrent transactions, not whether one transaction is applied as a complete unit.", "Durability means committed changes survive failures. Atomicity concerns whether the transaction takes effect at all."]}, {"number": 24, "question": "Isolation ensures that:", "options": ["Transactions are permanently stored.", "Transactions do not interfere with each other.", "All constraints are preserved.", "Transactions execute faster."], "answer": 1, "explanation": "Isolation controls interference between concurrent transactions. The guarantees depend on the isolation level; SERIALIZABLE is stronger than READ COMMITTED.", "optionReasons": ["Permanent storage of committed changes is durability, not isolation.", "Correct as the general goal. Isolation controls how concurrent transactions affect one another; the exact guarantees depend on the isolation level.", "Preserving validity rules is consistency. Isolation supports correct concurrent execution but is a different ACID property.", "Isolation does not promise faster execution. Stronger isolation can increase waiting or require retries."]}, {"number": 25, "question": "A deadlock occurs when:", "options": ["A transaction fails.", "Two or more transactions wait indefinitely for each other.", "A table is locked.", "A transaction is rolled back."], "answer": 1, "explanation": "A deadlock is a cycle of waiting transactions, each holding a resource another needs. A DBMS can break the cycle by aborting a transaction. A locked table alone is not a deadlock.", "optionReasons": ["A failed transaction can have many causes and does not necessarily involve a circular wait.", "Correct. A cycle of transactions waits for resources held by one another. A DBMS may detect the deadlock and abort a transaction to break it.", "A lock is normal concurrency control. A single locked table does not by itself imply a circular wait.", "A rollback can resolve a deadlock, but rollbacks also occur for other reasons. It is not the definition of a deadlock."]}, {"number": 26, "question": "What is a view in SQL?", "options": ["A physical table.", "A stored query presented as a virtual table.", "An index.", "A trigger."], "answer": 1, "explanation": "An ordinary view is a stored query presented as a virtual table. A materialized view is a special case that can store its result.", "optionReasons": ["A base table physically stores rows. An ordinary view instead exposes the result of a stored query definition.", "Correct. A normal view presents a stored query as a virtual table. Materialized views are a separate case that can store results.", "An index is an access structure used to find rows efficiently. It is not a named query presented as a table.", "A trigger runs automatically in response to specified events. A view provides a queryable interface."]}, {"number": 27, "question": "Which statement about indexes is true?", "options": ["Indexes reduce storage space.", "Indexes always speed up INSERT operations.", "Indexes improve data retrieval performance.", "Indexes enforce referential integrity."], "answer": 2, "explanation": "A suitable index can speed up retrieval by reducing the data that must be searched. Indexes take space and require maintenance during writes; they do not benefit every query.", "optionReasons": ["Indexes generally require additional storage for their access structures rather than reducing the space needed for the table.", "INSERT may become slower because the database must update applicable indexes as well as insert the row. “Always” makes this false.", "Best option. A suitable index can speed up retrieval by avoiding unnecessary scanning. It does not improve every query, and the optimizer may choose not to use it.", "Foreign-key constraints enforce referential integrity. Indexes can support checks efficiently, but an index alone does not validate cross-table references."]}, {"number": 28, "question": "Which JOIN returns all tuples from the left table and matching tuples from the right?", "options": ["INNER JOIN.", "RIGHT OUTER JOIN.", "FULL OUTER JOIN.", "LEFT OUTER JOIN."], "answer": 3, "explanation": "LEFT OUTER JOIN keeps every left-hand row. If no right-hand row matches, the right-hand columns are NULL. Multiple matches can produce multiple result rows.", "optionReasons": ["INNER JOIN returns only matching combinations, so it can drop left-hand rows that have no match.", "RIGHT OUTER JOIN preserves all rows from the right-hand table. The question asks to preserve the left-hand table.", "FULL OUTER JOIN preserves unmatched rows from both sides. That includes additional unmatched right-hand rows, beyond what the question asks for.", "Correct. LEFT OUTER JOIN preserves every left-hand row and fills right-hand columns with NULL when there is no match."]}, {"number": 29, "question": "What does data independence mean?", "options": ["Applications are independent of users.", "Logical schema changes do not affect Applications.", "Data is duplicated across tables.", "Data is stored in multiple formats."], "answer": 1, "explanation": "B describes logical data independence: applications and external views are protected from conceptual-schema changes. Physical data independence protects the logical model from changes to storage.", "optionReasons": ["User accounts and permissions are separate concerns. Data independence concerns changes between levels of a database’s architecture.", "Best option. This describes logical data independence: higher-level views and applications are insulated from conceptual-schema changes. Physical data independence similarly insulates the logical level from storage changes.", "Duplicating data is redundancy. It does not define independence between schema or storage levels.", "Using multiple storage formats is a representation choice. Data independence is the ability to change a lower level without requiring changes at higher levels."]}, {"number": 30, "question": "A stored procedure in the context of a relational database is a:", "options": ["Table that temporary stores data.", "Predefined set of SQL statements stored for reuse.", "Constraint that ensures data uniqueness.", "Type of primary key."], "answer": 1, "explanation": "A stored procedure is a predefined set of SQL statements stored in the database for reuse.", "optionReasons": ["This describes a temporary table. A stored procedure stores executable SQL logic rather than being a table of temporary data.", "Correct. A stored procedure contains predefined SQL statements that can be invoked and reused, often with parameters.", "UNIQUE or PRIMARY KEY constraints enforce uniqueness. A stored procedure is not itself a uniqueness constraint.", "A primary key identifies rows. A stored procedure is executable database logic, not a key."]}], "b": [{"number": 31, "title": "Normalization and UML", "points": 16, "question": "Assume you have the following given table that stores information about employees, their departments, and the projects they work on. Normalize the table below and make sure you define each normalform and then explain and exemplify the transformation from the lower to the higher normalform.", "tables": [{"caption": "Part 1 of table", "headers": ["Employee_ID", "Employee_Name", "Department", "Manager_Name", "Project_ID", "Project_Name", "Project_Start_Date"], "rows": [["E001", "Alice", "HR", "John Doe", "P001", "Recruitment", "2022-01-01"], ["E002", "Bob", "IT", "Jane Smith", "P002", "Website Dev", "2022-02-01"], ["E003", "Charlie", "IT", "Jane Smith", "P003", "App Dev", "2022-03-01"], ["E004", "Dave", "HR", "John Doe", "P004", "Training", "2022-03-15"], ["E005", "Eve", "HR", "John Doe", "P001", "Recruitment", "2022-01-01"]]}, {"caption": "Part 2 of table — same row order as part 1", "headers": ["Employee_Phone", "Department_Location", "Manager_Phone", "Salary"], "rows": [["123-456-7890", "New York", "321-654-9870", "50000"], ["123-456-7891", "San Francisco", "321-654-9871", "60000"], ["123-456-7892", "San Francisco", "321-654-9871", "65000"], ["123-456-7893", "New York", "321-654-9870", "55000"], ["123-456-7894", "New York", "321-654-9870", "52000"]]}], "parts": [{"label": "a", "text": "UNF to 1NF (4p)", "sql": false, "solution": {"paragraphs": ["UNF may contain lists or repeating groups. In 1NF, each attribute position holds an atomic value from its domain. A list of projects is split into one row per employee–project combination.", "The five displayed rows are already atomic. Printing a wide table in two sections does not make it unnormalized. There is no need to invent extra projects or phone numbers.", "Assume each employee belongs to one department but can work on several projects, and each project can have several employees. Each department has one location and one manager; each manager has one phone number. Department and Manager_Name are treated as unique in this example. Stable Department_ID and Manager_ID values would be preferable in a real system.", "Under the many-to-many assumption, (Employee_ID, Project_ID) is a candidate key. E001–P001 records Alice working on Recruitment. If Alice also joins P002, another row is needed. Employee_ID being unique in this small sample does not prove that it is always a key."]}}, {"label": "b", "text": "1NF to 2NF (4p)", "sql": false, "solution": {"paragraphs": ["2NF requires 1NF and full dependency of every non-prime attribute on every candidate key. With (Employee_ID, Project_ID) as the key, employee details depend only on Employee_ID, while project details depend only on Project_ID. These are partial dependencies.", "Create Employee_2NF(Employee_ID PK, Employee_Name, Employee_Phone, Salary, Department, Department_Location, Manager_Name, Manager_Phone); Project(Project_ID PK, Project_Name, Project_Start_Date); and Employee_Project(Employee_ID PK/FK, Project_ID PK/FK). The linking table has a composite primary key.", "Employee_2NF has five rows; Project has four because P001 is shared by Alice and Eve. Employee_Project has five rows: E001–P001, E002–P002, E003–P003, E004–P004 and E005–P001. The employee–project assignments are preserved."]}}, {"label": "c", "text": "2NF to 3NF (4p)", "sql": false, "solution": {"paragraphs": ["3NF addresses the remaining problematic transitive dependencies. For each non-trivial X → A, X must be a superkey or A must belong to a candidate key.", "Assume Employee_ID → Department, Department → Department_Location and Manager_Name, and Manager_Name → Manager_Phone. Move department and manager details out of Employee_2NF.", "The final tables are Employee(Employee_ID PK, Employee_Name, Employee_Phone, Salary, Department FK), Department(Department PK, Department_Location, Manager_Name FK), Manager(Manager_Name PK, Manager_Phone), plus the unchanged Project and Employee_Project tables. All eleven original attributes are retained.", "Store HR once with New York and John Doe. Store John Doe once with 321-654-9870. Alice, Dave and Eve reference HR. IT references Jane Smith, whose phone number is 321-654-9871. Updating a department address or manager phone no longer requires changing several employee rows."], "tables": [{"caption": "Department after decomposition", "headers": ["Department (PK)", "Department_Location", "Manager_Name (FK)"], "rows": [["HR", "New York", "John Doe"], ["IT", "San Francisco", "Jane Smith"]]}, {"caption": "Manager after decomposition", "headers": ["Manager_Name (PK)", "Manager_Phone"], "rows": [["John Doe", "321-654-9870"], ["Jane Smith", "321-654-9871"]]}]}}, {"label": "d", "text": "When you achieved the 3NF, then draw a logical ER-model of the final normalized solution by using perfect UML notation. Make sure all PKs is defined and all foreign keys is represented as well as relationship and cardinality. (4p)", "sql": false, "solution": {"paragraphs": ["The diagram uses UML classes and associations with multiplicities. {PK} and {FK} identify database keys. The two {PK} attributes in Employee_Project form one composite primary key.", "Each Employee has exactly 1 Department; a Department has 0..* employees. Each Department has exactly 1 Manager; a Manager can manage 0..* departments. Each linking row has exactly 1 Employee and exactly 1 Project. Each employee and each project can have 0..* linking rows, representing a many-to-many relationship.", "Foreign keys: Employee.Department → Department.Department; Department.Manager_Name → Manager.Manager_Name; Employee_Project.Employee_ID → Employee.Employee_ID; Employee_Project.Project_ID → Project.Project_ID.", "These multiplicities follow the assumptions in part a. If business rules allow only one project per employee, Project_ID could instead be a foreign key in Employee. That alternative requires a different explicit assumption."], "diagram": "<div class=\"uml-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"UML model with five classes, keys and multiplicities\"><svg viewBox=\"0 0 940 530\" role=\"img\" aria-labelledby=\"uml31-title uml31-desc\" xmlns=\"http://www.w3.org/2000/svg\"><title id=\"uml31-title\">Logical UML class diagram in 3NF<\/title><desc id=\"uml31-desc\">A manager has zero or more departments. Each department has one manager and zero or more employees. Each employee belongs to one department and has zero or more employee-project assignments. Each project has zero or more assignments. Each assignment references exactly one employee and one project. PK and FK mark the keys.<\/desc><g fill=\"none\" stroke=\"#36564f\" stroke-width=\"2\"><path d=\"M255 98H335M595 98H675M795 229V350M595 400H675\"/><\/g><g fill=\"#36564f\" font-family=\"system-ui,sans-serif\" font-size=\"15\"><text x=\"265\" y=\"88\">1<\/text><text x=\"294\" y=\"88\">0..*<\/text><text x=\"605\" y=\"88\">1<\/text><text x=\"634\" y=\"88\">0..*<\/text><text x=\"805\" y=\"275\">1<\/text><text x=\"805\" y=\"337\">0..*<\/text><text x=\"605\" y=\"390\">1<\/text><text x=\"634\" y=\"390\">0..*<\/text><\/g><g font-family=\"system-ui,sans-serif\" font-size=\"14\" fill=\"#172f2b\"><rect x=\"15\" y=\"40\" width=\"240\" height=\"108\" fill=\"#fff\" stroke=\"#36564f\" stroke-width=\"1.5\"/><text x=\"135.0\" y=\"66\" text-anchor=\"middle\" font-weight=\"700\">Manager<\/text><path d=\"M15 80h240\" stroke=\"#36564f\"/><text x=\"27\" y=\"105\">Manager_Name {PK}<\/text><text x=\"27\" y=\"132\">Manager_Phone<\/text><\/g><g font-family=\"system-ui,sans-serif\" font-size=\"14\" fill=\"#172f2b\"><rect x=\"335\" y=\"40\" width=\"260\" height=\"135\" fill=\"#fff\" stroke=\"#36564f\" stroke-width=\"1.5\"/><text x=\"465.0\" y=\"66\" text-anchor=\"middle\" font-weight=\"700\">Department<\/text><path d=\"M335 80h260\" stroke=\"#36564f\"/><text x=\"347\" y=\"105\">Department {PK}<\/text><text x=\"347\" y=\"132\">Department_Location<\/text><text x=\"347\" y=\"159\">Manager_Name {FK}<\/text><\/g><g font-family=\"system-ui,sans-serif\" font-size=\"14\" fill=\"#172f2b\"><rect x=\"675\" y=\"40\" width=\"250\" height=\"189\" fill=\"#fff\" stroke=\"#36564f\" stroke-width=\"1.5\"/><text x=\"800.0\" y=\"66\" text-anchor=\"middle\" font-weight=\"700\">Employee<\/text><path d=\"M675 80h250\" stroke=\"#36564f\"/><text x=\"687\" y=\"105\">Employee_ID {PK}<\/text><text x=\"687\" y=\"132\">Employee_Name<\/text><text x=\"687\" y=\"159\">Employee_Phone<\/text><text x=\"687\" y=\"186\">Salary<\/text><text x=\"687\" y=\"213\">Department {FK}<\/text><\/g><g font-family=\"system-ui,sans-serif\" font-size=\"14\" fill=\"#172f2b\"><rect x=\"335\" y=\"350\" width=\"260\" height=\"135\" fill=\"#fff\" stroke=\"#36564f\" stroke-width=\"1.5\"/><text x=\"465.0\" y=\"376\" text-anchor=\"middle\" font-weight=\"700\">Project<\/text><path d=\"M335 390h260\" stroke=\"#36564f\"/><text x=\"347\" y=\"415\">Project_ID {PK}<\/text><text x=\"347\" y=\"442\">Project_Name<\/text><text x=\"347\" y=\"469\">Project_Start_Date<\/text><\/g><g font-family=\"system-ui,sans-serif\" font-size=\"14\" fill=\"#172f2b\"><rect x=\"675\" y=\"350\" width=\"250\" height=\"108\" fill=\"#fff\" stroke=\"#36564f\" stroke-width=\"1.5\"/><text x=\"800.0\" y=\"376\" text-anchor=\"middle\" font-weight=\"700\">Employee_Project<\/text><path d=\"M675 390h250\" stroke=\"#36564f\"/><text x=\"687\" y=\"415\">Employee_ID {PK, FK}<\/text><text x=\"687\" y=\"442\">Project_ID {PK, FK}<\/text><\/g><\/svg><\/div>"}}]}, {"number": 32, "title": "GDPR", "points": 6, "question": "The General Data Protection Regulation (GDPR) has a notable impact on database design, influencing how organizations structure and manage their databases to ensure compliance with the regulation.", "tables": [], "parts": [{"label": "a", "text": "What is the purpose with GDPR? (2p)", "sql": false, "solution": {"paragraphs": ["GDPR protects people’s rights and freedoms when personal data is processed and establishes rules for that processing. Data protection should be built into systems and working practices."]}}, {"label": "b", "text": "Discuss the four most important aspects of how GDPR impacts our design of databases? (4p)", "sql": false, "solution": {"paragraphs": ["Four relevant design considerations:", "1. Purpose and data minimization: store only the personal data needed for the specified purpose.", "2. Retention: plan deletion or anonymization when data is no longer needed, taking applicable retention requirements into account.", "3. Security and access: apply appropriate safeguards and give users only the permissions they need.", "4. Individual rights: make personal data retrievable and manageable for requests such as access or erasure where the right applies."]}}]}, {"number": 33, "title": "Fan trap and chasm trap", "points": 8, "question": "I want you to explain the problem and how to resolve the problem if you find", "tables": [], "parts": [{"label": "a", "text": "a fan trap (4p)", "sql": false, "solution": {"paragraphs": ["A fan trap creates an ambiguous relationship path. For example, Branch has many employees and many projects, but the model does not identify which employee works on which project. Joining through Branch may invent unsupported combinations.", "Model the actual Employee–Project relationship, using Employee_Project for a many-to-many relationship. Choose cardinalities from business rules. DISTINCT does not repair a missing relationship."]}}, {"label": "b", "text": "a chasm trap. (4p)", "sql": false, "solution": {"paragraphs": ["A chasm trap occurs when an expected relationship path is missing for some instances because participation is optional. For example, a branch has employees who manage projects. A project without an assigned employee cannot be linked to its branch through that path.", "Add a direct Branch–Project relationship if projects belong to branches independently of staffing. A LEFT JOIN can preserve unmatched rows, but it cannot recover a branch assignment that was never stored."]}}]}]}}</script>
<script>
'use strict';
const banks=JSON.parse(document.getElementById('data').textContent);
const key='dt4026-simple-v1',app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const letter=(i,q)=>q.labels?.[i]||'ABCD'[i];
const empty=()=>({answers:{},index:0,written:{},writtenIndex:0,part:'A',results:false});
let model={version:2,exam:'common',banks:{common:empty(),new2026:empty()}};
function clean(id,value){
 const out=empty(),b=banks[id];if(!value||typeof value!=='object')return out;
 for(const q of b.a){const a=value.answers?.[q.number];if(Number.isInteger(a)&&a>=0&&a<4)out.answers[q.number]=a}
 for(const q of b.b)for(const p of q.parts){const k=q.number+'-'+p.label;if(typeof value.written?.[k]==='string')out.written[k]=value.written[k]}
 if(Number.isInteger(value.index)&&value.index>=0&&value.index<b.a.length)out.index=value.index;
 if(Number.isInteger(value.writtenIndex)&&value.writtenIndex>=0&&value.writtenIndex<b.b.length)out.writtenIndex=value.writtenIndex;
 out.part=value.part==='B'?'B':'A';out.results=value.results===true;return out;
}
try{
 const raw=localStorage.getItem(key);
 if(raw){const data=JSON.parse(raw);model.exam=data.exam==='new2026'?'new2026':'common';for(const id of Object.keys(banks))model.banks[id]=clean(id,data.banks?.[id]);if(data.version!==2){const s=model.banks.new2026;if(s.writtenIndex===1)s.writtenIndex=2;if(s.results&&!Number.isInteger(s.answers[30])){s.results=false;s.index=29}}}
 else{
  const old=JSON.parse(localStorage.getItem('dt4026-unique-quiz-v1')||'null');
  if(old){const states=old.schema===3?old.states:{common:old};model.exam=old.date==='2026-01-13'?'new2026':'common';for(const id of Object.keys(banks)){const s=states?.[id];if(s){const number=s.session?.order?.[s.session?.index];model.banks[id]=clean(id,{answers:s.session?.selections,index:Math.max(0,banks[id].a.findIndex(q=>q.number===number)),written:s.written?.answers,writtenIndex:id==='new2026'&&s.written?.index===1?2:s.written?.index,part:s.part,results:s.session?.finished})}}}
 }
}catch(e){}
function state(){return model.banks[model.exam]}
function bank(){return banks[model.exam]}
function save(){try{localStorage.setItem(key,JSON.stringify(model))}catch(e){}}
function score(){return bank().a.filter(q=>state().answers[q.number]===q.answer).length}
function answered(){return bank().a.filter(q=>Number.isInteger(state().answers[q.number])).length}
function table(t){return `<div class="table-wrap" tabindex="0"><table><caption>${esc(t.caption)}</caption><thead><tr>${t.headers.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function render(){
 const s=state();document.getElementById('exam').value=model.exam;
 document.getElementById('tab-a').setAttribute('aria-pressed',s.part==='A');document.getElementById('tab-b').setAttribute('aria-pressed',s.part==='B');
 if(s.part==='B')renderWritten();else if(s.results)renderResult();else renderQuestion();
}
function renderQuestion(){
 const s=state(),qs=bank().a,q=qs[s.index],choice=s.answers[q.number],checked=Number.isInteger(choice),right=choice===q.answer;
 const message=q.ambiguous?(right?'Best answer.':'The selected best answer is '+letter(q.answer,q)+'.'):(right?'Correct!':'Incorrect. The correct answer is '+letter(q.answer,q)+'.');
 app.innerHTML=`<section class="card"><div class="meta"><span>Question ${s.index+1} of ${qs.length}</span><button type="button" class="plain" data-action="restart">Restart</button></div><h2 lang="en">${esc(q.question)}</h2>${checked?`<div class="feedback ${right?'':'wrong'}" role="status"><strong>${esc(message)}</strong></div>`:''}<div class="options" aria-label="Answer options">${q.options.map((text,i)=>`<div class="option-block"><button type="button" class="option ${checked&&i===q.answer?'right':''} ${checked&&i===choice&&!right?'wrong':''}" data-choice="${i}" ${checked?'disabled':''} aria-pressed="${i===choice}" ${checked?`aria-describedby="reason-${q.number}-${i}"`:''}><span class="letter">${letter(i,q)}</span><span class="option-text" lang="en">${esc(text)}${checked&&i===q.answer?' <span aria-label="Selected correct answer">✓</span>':''}</span></button>${checked?`<p class="option-note ${i===q.answer?'right':i===choice?'chosen':''}" id="reason-${q.number}-${i}">${esc(q.optionReasons[i])}</p>`:''}</div>`).join('')}</div><div class="navrow"><button type="button" class="btn" data-action="prev" ${s.index===0?'disabled':''}>← Previous</button><button type="button" class="btn primary" data-action="${s.index===qs.length-1?'result':'next'}">${s.index===qs.length-1?'Show result':'Next →'}</button></div></section>`;
}
function renderResult(){app.innerHTML=`<section class="card center"><h2>Your result</h2><div class="score">${score()} / ${bank().a.length}</div><p>correct · ${bank().a.length-answered()} unanswered</p><div class="navrow"><button type="button" class="btn" data-action="back">Back to questions</button><button type="button" class="btn primary" data-action="restart">Restart</button></div></section>`}
function renderWritten(){
 const s=state(),qs=bank().b,q=qs[s.writtenIndex];
 app.innerHTML=`<section class="card"><div class="meta"><span>Question ${s.writtenIndex+1} of ${qs.length}</span><span>${q.points} points</span></div><h2>${esc(q.title)}</h2><p class="original-number">Question ${q.number}</p><p lang="en">${esc(q.question)}</p>${q.tables.map(table).join('')}${q.parts.map(p=>{const k=q.number+'-'+p.label;const solution=p.solution;return `<section class="sub"><h3>${p.label.toUpperCase()}.${p.sql?' SQL':''}${!p.sql?' '+esc(p.text):''}</h3>${p.sql?`<pre lang="en">${esc(p.text)}</pre>`:''}<label class="written-label" for="answer-${k}">Your answer</label><textarea id="answer-${k}" data-written="${k}" rows="5">${esc(s.written[k]||'')}</textarea><details><summary>Show answer</summary><div class="solution">${solution.paragraphs.map(t=>`<p>${esc(t)}</p>`).join('')}${solution.table?table(solution.table):''}${(solution.tables||[]).map(table).join('')}${solution.diagram||''}</div></details></section>`}).join('')}<div class="navrow"><button type="button" class="btn" data-action="written-prev" ${s.writtenIndex===0?'disabled':''}>← Previous</button><button type="button" class="btn primary" data-action="written-next" ${s.writtenIndex===qs.length-1?'disabled':''}>Next →</button></div></section>`;
}
function choose(choice){const s=state(),q=bank().a[s.index];if(Number.isInteger(s.answers[q.number])||!Number.isInteger(choice)||choice<0||choice>3)return;s.answers[q.number]=choice;save();render()}
function switchExam(id){if(!banks[id])return;model.exam=id;save();render()}
function action(name){
 const s=state();
 if(name==='restart'){if(answered()&&!confirm('Restart section A?'))return;s.answers={};s.index=0;s.results=false}
 if(name==='prev')s.index=Math.max(0,s.index-1);
 if(name==='next')s.index=Math.min(bank().a.length-1,s.index+1);
 if(name==='result')s.results=true;
 if(name==='back')s.results=false;
 if(name==='written-prev')s.writtenIndex=Math.max(0,s.writtenIndex-1);
 if(name==='written-next')s.writtenIndex=Math.min(bank().b.length-1,s.writtenIndex+1);
 save();render();if(['next','prev','written-next','written-prev'].includes(name))window.scrollTo({top:0,behavior:'auto'});
}
document.getElementById('exam').addEventListener('change',e=>switchExam(e.target.value));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.part){state().part=b.dataset.part;save();render()}else if(b.dataset.choice!==undefined)choose(Number(b.dataset.choice));else if(b.dataset.action)action(b.dataset.action)});
app.addEventListener('input',e=>{if(!e.target.dataset.written)return;state().written[e.target.dataset.written]=e.target.value;save()});
document.addEventListener('keydown',e=>{if(state().part!=='A'||state().results||['TEXTAREA','INPUT','SELECT','BUTTON'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(/^[1-4]$/.test(e.key)){e.preventDefault();choose(Number(e.key)-1)}});
render();
</script>
</body>
</html>
