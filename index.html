size:15px;margin:7px 0 0}.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.btn{border:1px solid #bdcdc2;border-radius:9px;background:white;padding:10px 18px;font-weight:600}.primary{background:var(--green);color:white;border-color:var(--green)}.btn:disabled{opacity:.4}.plain{border:0;background:transparent;font-size:13px;color:var(--muted);padding:5px 0;text-decoration:underline;text-underline-offset:3px}.score{font-size:54px;letter-spacing:-2px;font-weight:750;margin:20px 0 4px}.center{text-align:center;padding:45px 28px}.sub{margin-top:28px;border-top:1px solid var(--line);padding-top:18px}.sub h3{margin:0 0 12px}textarea{width:100%;min-height:150px;resize:vertical;padding:13px 15px;border:1px solid #bdcdc2;border-radius:9px;background:#fcfdfb;display:block;line-height:1.6}details{margin-top:14px}summary{cursor:pointer;color:var(--green);font-weight:600;padding:5px 0}.solution{font-size:15px;padding:12px 18px;background:#f0f6ed;border-radius:10px;margin-top:8px}.solution p:first-child{margin-top:0}.solution p:last-child{margin-bottom:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;margin:18px 0}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left;background:white}caption{padding:10px 12px;text-align:left;background:#eef3eb;font-weight:650}th,td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}th{background:#f8faf6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;background:#f1f4ed;padding:16px;border-radius:9px}.uml-wrap{overflow:auto;margin:18px 0;background:white;border-radius:8px}.uml-wrap svg{display:block;width:100%;min-width:740px;height:auto}.written-label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.original-number{font-size:12px;color:var(--muted);margin-top:-14px;margin-bottom:18px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){main{margin:20px auto;padding:0 14px 30px}header{align-items:flex-start;flex-direction:column;gap:12px}.picker{width:100%;display:flex;align-items:center}.picker select{flex:1}.card{padding:20px}h2{font-size:20px}.option{padding:14px}.navrow .btn{padding:10px 14px}nav button{font-size:14px;padding:10px}.score{font-size:46px}.uml-wrap svg{min-width:700px}}
